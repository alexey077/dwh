global
    maxconn 1000
    log stdout format raw local0

defaults
    mode tcp
    log global
    retries 2
    timeout connect 4s
    timeout client 30m
    timeout server 30m
    timeout check 3s

listen stats
    mode http
    bind *:7005
    stats enable
    stats uri /
    stats refresh 2s

listen postgres_write
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008 maxconn 200
    server pg2 pg2:5432 check port 8008 maxconn 200
    server pg3 pg3:5432 check port 8008 maxconn 200

listen postgres_read
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008 maxconn 200
    server pg2 pg2:5432 check port 8008 maxconn 200
    server pg3 pg3:5432 check port 8008 maxconn 200
