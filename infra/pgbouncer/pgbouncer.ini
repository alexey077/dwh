[databases]
crm_service_db = host=haproxy port=5000 dbname=crm_service_db
catalog_service_db = host=haproxy port=5000 dbname=catalog_service_db
pos_service_db = host=haproxy port=5000 dbname=pos_service_db
wms_service_db = host=haproxy port=5000 dbname=wms_service_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5
server_lifetime = 120
server_idle_timeout = 60
server_login_retry = 2
query_wait_timeout = 30
ignore_startup_parameters = extra_float_digits,options
