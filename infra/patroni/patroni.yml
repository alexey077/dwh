scope: apteka108
namespace: /service/

etcd3:
  hosts: [etcd1:2379, etcd2:2379, etcd3:2379]

watchdog:
  mode: off

restapi:
  listen: 0.0.0.0:8008
  authentication:
    username: patroni
    password: patroni

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: false
    failsafe_mode: false
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: logical
        hot_standby: 'on'
        max_connections: 80
        max_wal_senders: 10
        max_replication_slots: 10
        wal_keep_size: 128MB
        max_slot_wal_keep_size: 1GB
        password_encryption: scram-sha-256
        timezone: UTC
        datestyle: ISO, YMD
  initdb:
    - encoding: UTF8
    - data-checksums
    - auth-host: scram-sha-256

postgresql:
  data_dir: /var/lib/postgresql/18/data
  bin_dir: /usr/lib/postgresql/18/bin
  listen: 0.0.0.0:5432
  pgpass: /tmp/pgpass
  authentication:
    superuser:
      username: postgres
      password: postgres
    replication:
      username: replicator
      password: replicator
  pg_hba:
    - local all all trust
    - host all all 127.0.0.1/32 trust
    - host all all 0.0.0.0/0 scram-sha-256
    - host replication replicator 0.0.0.0/0 scram-sha-256

tags:
  nofailover: false
  noloadbalance: false
  nosync: false
