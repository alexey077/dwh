name: apteka108-hw1

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.21
  restart: unless-stopped
  environment: &etcd-env
    ETCD_DATA_DIR: /etcd-data
    ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    ETCD_INITIAL_CLUSTER: etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_INITIAL_CLUSTER_TOKEN: apteka108-etcd
    ETCDCTL_API: '3'
  healthcheck:
    test: [CMD, etcdctl, --endpoints=http://127.0.0.1:2379, endpoint, health]
    interval: 5s
    timeout: 3s
    retries: 30

x-patroni: &patroni
  image: apteka108-patroni:hw1
  build:
    context: .
    dockerfile: infra/patroni/Dockerfile
  user: postgres
  restart: unless-stopped
  depends_on:
    etcd1: {condition: service_healthy}
    etcd2: {condition: service_healthy}
    etcd3: {condition: service_healthy}
  healthcheck:
    test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8008/health >/dev/null']
    interval: 5s
    timeout: 3s
    retries: 60
    start_period: 10s

services:
  etcd1:
    <<: *etcd
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd1
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380
    volumes: [etcd1_data:/etcd-data]

  etcd2:
    <<: *etcd
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd2
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380
    volumes: [etcd2_data:/etcd-data]

  etcd3:
    <<: *etcd
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd3
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380
    volumes: [etcd3_data:/etcd-data]

  pg1:
    <<: *patroni
    environment:
      PATRONI_NAME: pg1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg1:5432
    volumes: [pg1_data:/var/lib/postgresql]
    ports: ['127.0.0.1:5432:5432', '127.0.0.1:8008:8008']

  pg2:
    <<: *patroni
    environment:
      PATRONI_NAME: pg2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg2:5432
    volumes: [pg2_data:/var/lib/postgresql]
    ports: ['127.0.0.1:5433:5432', '127.0.0.1:8009:8008']

  pg3:
    <<: *patroni
    environment:
      PATRONI_NAME: pg3
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg3:5432
    volumes: [pg3_data:/var/lib/postgresql]
    ports: ['127.0.0.1:5434:5432', '127.0.0.1:8010:8008']

  haproxy:
    image: haproxy:3.2-alpine
    depends_on:
      pg1: {condition: service_healthy}
      pg2: {condition: service_healthy}
      pg3: {condition: service_healthy}
    volumes: ['./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro']
    ports: ['127.0.0.1:5000:5000', '127.0.0.1:5001:5001', '127.0.0.1:7005:7005']
    restart: unless-stopped

  init:
    image: apteka108-patroni:hw1
    build:
      context: .
      dockerfile: infra/patroni/Dockerfile
    user: postgres
    working_dir: /project
    entrypoint: [python, scripts/migrate.py]
    environment:
      ADMIN_DSN: postgresql://postgres:postgres@haproxy:5000/postgres
    volumes: ['./:/project:ro']
    depends_on:
      haproxy: {condition: service_started}
    restart: on-failure:3

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    depends_on:
      init: {condition: service_completed_successfully}
    volumes:
      - ./infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infra/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports: ['127.0.0.1:6432:6432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -p 6432 -U checker -d pos_service_db']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  cluster-status:
    image: apteka108-patroni:hw1
    build:
      context: .
      dockerfile: infra/patroni/Dockerfile
    user: postgres
    entrypoint: [python, /project/scripts/cluster_status.py]
    volumes: ['./scripts/cluster_status.py:/project/scripts/cluster_status.py:ro']
    ports: ['127.0.0.1:8011:8011']
    depends_on:
      pg1: {condition: service_healthy}
      pg2: {condition: service_healthy}
      pg3: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8011/health', timeout=8)"]
      interval: 10s
      timeout: 9s
      retries: 30
    restart: unless-stopped

  tools:
    image: apteka108-patroni:hw1
    build:
      context: .
      dockerfile: infra/patroni/Dockerfile
    profiles: [tools]
    user: '0:0'
    working_dir: /project
    entrypoint: [python]
    environment:
      DWH_CONTAINER: '1'
      ADMIN_DSN: postgresql://postgres:postgres@haproxy:5000/postgres
      PATRONI_API: http://pg1:8008
      CLUSTER_STATUS_API: http://cluster-status:8011
    volumes: ['./:/project']
    depends_on:
      init: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}
      cluster-status: {condition: service_healthy}

volumes:
  pg1_data:
  pg2_data:
  pg3_data:
  etcd1_data:
  etcd2_data:
  etcd3_data:
