name: hw1 verification

"on":
  push:
    branches: [hw1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-stand:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and syntax
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q scripts tests
          python hw01/hw01_check.py --self-test
          python tests/check_measurements.py
          docker compose --profile tools config --quiet
          mkdir -p reports
      - name: Start from empty volumes
        run: |
          docker compose up -d --build
          ./scripts/wait_ready.sh
      - name: Generate full data
        run: ./scripts/seed.sh --seed 42
      - name: Source table prerequisites and application permissions
        run: docker compose run --rm -T tools tests/check_schema.py
      - name: Official checker and raw score
        id: official
        continue-on-error: true
        run: ./scripts/check.sh --verbose
      - name: Runtime assertions and documented checker discrepancy
        run: python tests/assert_runtime_report.py reports/check_report.json
      - name: Experiments E1 to E7
        run: python scripts/experiments.py
      - name: Official checker after failures
        continue-on-error: true
        run: ./scripts/check.sh --verbose --json reports/check_after_failures.json
      - name: Runtime assertions after failures
        run: python tests/assert_runtime_report.py reports/check_after_failures.json
      - name: Save container logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/docker.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw1-runtime-evidence
          path: |
            reports/
            docs/failover_journal.md
            docs/experiments/
      - name: Stop the isolated CI stand
        if: always()
        run: docker compose down -v
