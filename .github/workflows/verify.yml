name: hw1 verification

"on":
  push:
    branches: [hw1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-stand:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies, source checks and configuration
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q scripts tests
          python hw01/hw01_check.py --self-test
          python tests/check_measurements.py
          bash -n scripts/check.sh scripts/seed.sh scripts/wait_ready.sh scripts/verify.sh
          docker compose --profile tools config --quiet
      - name: Full verification from empty volumes using the documented command
        run: ./scripts/verify.sh --full
      - name: Save container logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/docker.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw1-runtime-evidence
          path: |
            reports/
            docs/failover_journal.md
            docs/experiments/
      - name: Stop the isolated CI stand
        if: always()
        run: docker compose down -v
