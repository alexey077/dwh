team:
  members: ["Шутов Алексей"]
  github_logins: ["alexey077"]
  solo: true

entrypoint:
  up: "docker compose up -d"
  wait_ready: "./scripts/wait_ready.sh"
  seed: "./scripts/seed.sh --seed 42"
  seed_delta: "./scripts/seed.sh --seed 777 --receipts 500 --next-batch"
  down: "docker compose down -v"

