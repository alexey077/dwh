    wms: "postgresql://checker:checker@localhost:5001/wms_service_db"
  admin:
    crm: "postgresql://postgres:postgres@localhost:5000/crm_service_db"
    catalog: "postgresql://postgres:postgres@localhost:5000/catalog_service_db"
    pos: "postgresql://postgres:postgres@localhost:5000/pos_service_db"
    wms: "postgresql://postgres:postgres@localhost:5000/wms_service_db"
